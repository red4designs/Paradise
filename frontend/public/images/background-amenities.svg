<svg width="1920" height="1080" viewBox="0 0 1920 1080" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Night Sky Background -->
  <defs>
    <radialGradient id="skyGradient" cx="50%" cy="0%" r="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#16213e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f0f23;stop-opacity:1" />
    </radialGradient>
    <radialGradient id="starGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0" />
    </radialGradient>
  </defs>
  
  <!-- Sky Background -->
  <rect width="1920" height="1080" fill="url(#skyGradient)"/>
  
  <!-- Stars -->
  <circle cx="200" cy="150" r="1.5" fill="url(#starGlow)"/>
  <circle cx="400" cy="100" r="1" fill="url(#starGlow)"/>
  <circle cx="600" cy="180" r="1.2" fill="url(#starGlow)"/>
  <circle cx="800" cy="120" r="0.8" fill="url(#starGlow)"/>
  <circle cx="1000" cy="200" r="1.3" fill="url(#starGlow)"/>
  <circle cx="1200" cy="80" r="1" fill="url(#starGlow)"/>
  <circle cx="1400" cy="160" r="1.1" fill="url(#starGlow)"/>
  <circle cx="1600" cy="140" r="0.9" fill="url(#starGradient)"/>
  <circle cx="1800" cy="190" r="1.4" fill="url(#starGlow)"/>
  <circle cx="300" cy="250" r="0.7" fill="url(#starGlow)"/>
  <circle cx="500" cy="220" r="1.2" fill="url(#starGlow)"/>
  <circle cx="700" cy="280" r="0.8" fill="url(#starGlow)"/>
  <circle cx="900" cy="240" r="1" fill="url(#starGlow)"/>
  <circle cx="1100" cy="300" r="1.1" fill="url(#starGlow)"/>
  <circle cx="1300" cy="260" r="0.9" fill="url(#starGlow)"/>
  <circle cx="1500" cy="320" r="1.3" fill="url(#starGlow)"/>
  <circle cx="1700" cy="290" r="0.8" fill="url(#starGlow)"/>
  
  <!-- Mountain Silhouettes -->
  <path d="M0 600 L300 400 L600 500 L900 350 L1200 450 L1500 300 L1800 400 L1920 380 L1920 1080 L0 1080 Z" fill="#0a0a1a" opacity="0.8"/>
  <path d="M0 700 L200 550 L500 600 L800 480 L1100 580 L1400 420 L1700 520 L1920 500 L1920 1080 L0 1080 Z" fill="#151529" opacity="0.6"/>
  
  <!-- Resort Buildings Silhouettes -->
  <!-- Main Lodge -->
  <rect x="400" y="650" width="120" height="80" fill="#1a1a2e" opacity="0.9"/>
  <polygon points="400,650 460,600 520,650" fill="#252540" opacity="0.9"/>
  
  <!-- Amenity Buildings -->
  <rect x="600" y="680" width="80" height="60" fill="#1a1a2e" opacity="0.8"/>
  <polygon points="600,680 640,650 680,680" fill="#252540" opacity="0.8"/>
  
  <rect x="750" y="670" width="90" height="70" fill="#1a1a2e" opacity="0.8"/>
  <polygon points="750,670 795,640 840,670" fill="#252540" opacity="0.8"/>
  
  <!-- Swimming Pool Area -->
  <ellipse cx="950" cy="720" rx="60" ry="20" fill="#1e3a5f" opacity="0.7"/>
  
  <!-- Spa Building -->
  <rect x="1100" y="660" width="100" height="80" fill="#1a1a2e" opacity="0.8"/>
  <polygon points="1100,660 1150,620 1200,660" fill="#252540" opacity="0.8"/>
  
  <!-- Restaurant -->
  <rect x="1300" y="675" width="110" height="65" fill="#1a1a2e" opacity="0.8"/>
  <polygon points="1300,675 1355,635 1410,675" fill="#252540" opacity="0.8"/>
  
  <!-- Windows with warm light -->
  <rect x="420" y="670" width="8" height="12" fill="#ffb347" opacity="0.6"/>
  <rect x="440" y="670" width="8" height="12" fill="#ffb347" opacity="0.6"/>
  <rect x="480" y="670" width="8" height="12" fill="#ffb347" opacity="0.6"/>
  
  <rect x="620" y="695" width="6" height="10" fill="#ffb347" opacity="0.5"/>
  <rect x="640" y="695" width="6" height="10" fill="#ffb347" opacity="0.5"/>
  
  <rect x="770" y="685" width="7" height="11" fill="#ffb347" opacity="0.5"/>
  <rect x="790" y="685" width="7" height="11" fill="#ffb347" opacity="0.5"/>
  <rect x="810" y="685" width="7" height="11" fill="#ffb347" opacity="0.5"/>
  
  <rect x="1120" y="680" width="8" height="12" fill="#ffb347" opacity="0.5"/>
  <rect x="1140" y="680" width="8" height="12" fill="#ffb347" opacity="0.5"/>
  <rect x="1160" y="680" width="8" height="12" fill="#ffb347" opacity="0.5"/>
  
  <rect x="1320" y="690" width="7" height="11" fill="#ffb347" opacity="0.5"/>
  <rect x="1340" y="690" width="7" height="11" fill="#ffb347" opacity="0.5"/>
  <rect x="1360" y="690" width="7" height="11" fill="#ffb347" opacity="0.5"/>
  <rect x="1380" y="690" width="7" height="11" fill="#ffb347" opacity="0.5"/>
  
  <!-- Trees and Vegetation -->
  <ellipse cx="350" cy="720" rx="25" ry="40" fill="#1a2f1a" opacity="0.7"/>
  <ellipse cx="550" cy="730" rx="20" ry="35" fill="#1a2f1a" opacity="0.6"/>
  <ellipse cx="700" cy="740" rx="18" ry="30" fill="#1a2f1a" opacity="0.6"/>
  <ellipse cx="1050" cy="735" rx="22" ry="38" fill="#1a2f1a" opacity="0.6"/>
  <ellipse cx="1250" cy="745" rx="20" ry="32" fill="#1a2f1a" opacity="0.6"/>
  <ellipse cx="1450" cy="740" rx="24" ry="36" fill="#1a2f1a" opacity="0.7"/>
  
  <!-- Pathways -->
  <path d="M300 750 Q500 740 700 750 Q900 760 1100 750 Q1300 740 1500 750" stroke="#2a2a3e" stroke-width="3" fill="none" opacity="0.5"/>
  
  <!-- Text Elements -->
  <text x="960" y="400" text-anchor="middle" fill="#ff6b35" font-family="Arial, sans-serif" font-size="48" font-weight="bold" opacity="0.9">TREKKING</text>
  <text x="960" y="450" text-anchor="middle" fill="#4ecdc4" font-family="Arial, sans-serif" font-size="48" font-weight="bold" opacity="0.9">CAMPING &amp;</text>
  <text x="960" y="500" text-anchor="middle" fill="#ff6b35" font-family="Arial, sans-serif" font-size="48" font-weight="bold" opacity="0.9">ADVENTURE</text>
  
  <!-- Paradise Resort Text -->
  <text x="1400" y="580" text-anchor="middle" fill="#9b59b6" font-family="Arial, sans-serif" font-size="36" font-weight="bold" opacity="0.8">PARADISE</text>
  <text x="1400" y="620" text-anchor="middle" fill="#e67e22" font-family="Arial, sans-serif" font-size="36" font-weight="bold" opacity="0.8">RESORT</text>
  <text x="1400" y="650" text-anchor="middle" fill="#3498db" font-family="Arial, sans-serif" font-size="18" opacity="0.7">- VATTAVADA</text>
  
  <!-- Jeep Silhouette -->
  <g transform="translate(200,650) scale(0.8)">
    <rect x="0" y="20" width="80" height="25" fill="#2c3e50" opacity="0.8"/>
    <rect x="10" y="10" width="60" height="15" fill="#34495e" opacity="0.8"/>
    <circle cx="15" cy="50" r="8" fill="#2c3e50" opacity="0.8"/>
    <circle cx="65" cy="50" r="8" fill="#2c3e50" opacity="0.8"/>
    <rect x="20" y="15" width="8" height="8" fill="#ffb347" opacity="0.4"/>
    <rect x="35" y="15" width="8" height="8" fill="#ffb347" opacity="0.4"/>
    <rect x="50" y="15" width="8" height="8" fill="#ffb347" opacity="0.4"/>
  </g>
  
  <!-- Trekking Group Silhouettes -->
  <g transform="translate(1200,580) scale(0.6)">
    <!-- Person 1 -->
    <ellipse cx="10" cy="35" rx="3" ry="4" fill="#2c3e50" opacity="0.7"/>
    <rect x="8" y="40" width="4" height="15" fill="#2c3e50" opacity="0.7"/>
    <rect x="6" y="45" width="2" height="8" fill="#2c3e50" opacity="0.7"/>
    <rect x="12" y="45" width="2" height="8" fill="#2c3e50" opacity="0.7"/>
    <rect x="5" y="55" width="3" height="8" fill="#2c3e50" opacity="0.7"/>
    <rect x="12" y="55" width="3" height="8" fill="#2c3e50" opacity="0.7"/>
    
    <!-- Person 2 -->
    <ellipse cx="25" cy="30" rx="3" ry="4" fill="#2c3e50" opacity="0.7"/>
    <rect x="23" y="35" width="4" height="15" fill="#2c3e50" opacity="0.7"/>
    <rect x="21" y="40" width="2" height="8" fill="#2c3e50" opacity="0.7"/>
    <rect x="27" y="40" width="2" height="8" fill="#2c3e50" opacity="0.7"/>
    <rect x="20" y="50" width="3" height="8" fill="#2c3e50" opacity="0.7"/>
    <rect x="27" y="50" width="3" height="8" fill="#2c3e50" opacity="0.7"/>
    
    <!-- Person 3 -->
    <ellipse cx="40" cy="32" rx="3" ry="4" fill="#2c3e50" opacity="0.7"/>
    <rect x="38" y="37" width="4" height="15" fill="#2c3e50" opacity="0.7"/>
    <rect x="36" y="42" width="2" height="8" fill="#2c3e50" opacity="0.7"/>
    <rect x="42" y="42" width="2" height="8" fill="#2c3e50" opacity="0.7"/>
    <rect x="35" y="52" width="3" height="8" fill="#2c3e50" opacity="0.7"/>
    <rect x="42" y="52" width="3" height="8" fill="#2c3e50" opacity="0.7"/>
  </g>
  
  <!-- Ambient Light Effects -->
  <circle cx="960" cy="200" r="100" fill="url(#starGlow)" opacity="0.1"/>
  <circle cx="1400" cy="300" r="80" fill="url(#starGlow)" opacity="0.08"/>
  
</svg>