<svg width="500" height="500" viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="mountainGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a8a;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#3730a3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1e1b4b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="skyGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0c4a6e;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#075985;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0369a1;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="starGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fbbf24;stop-opacity:0" />
    </radialGradient>
  </defs>
  
  <!-- Night Sky Background -->
  <rect width="500" height="500" fill="url(#skyGradient)"/>
  
  <!-- Stars -->
  <circle cx="50" cy="50" r="1" fill="#fbbf24" opacity="0.8"/>
  <circle cx="150" cy="80" r="1.5" fill="#fbbf24" opacity="0.9"/>
  <circle cx="250" cy="40" r="1" fill="#fbbf24" opacity="0.7"/>
  <circle cx="350" cy="70" r="1.2" fill="#fbbf24" opacity="0.8"/>
  <circle cx="450" cy="60" r="1" fill="#fbbf24" opacity="0.6"/>
  <circle cx="100" cy="120" r="0.8" fill="#fbbf24" opacity="0.7"/>
  <circle cx="300" cy="100" r="1.3" fill="#fbbf24" opacity="0.9"/>
  <circle cx="400" cy="120" r="0.9" fill="#fbbf24" opacity="0.8"/>
  
  <!-- Mountain Silhouettes -->
  <path d="M0,300 L100,200 L200,250 L300,180 L400,220 L500,160 L500,500 L0,500 Z" fill="url(#mountainGradient)" opacity="0.9"/>
  
  <!-- Camping Scene -->
  <!-- Tent 1 -->
  <path d="M150,350 L180,320 L210,350 Z" fill="#ea580c" stroke="#dc2626" stroke-width="2"/>
  <path d="M150,350 L210,350 L210,380 L150,380 Z" fill="#dc2626"/>
  
  <!-- Tent 2 -->
  <path d="M280,360 L310,330 L340,360 Z" fill="#16a34a" stroke="#15803d" stroke-width="2"/>
  <path d="M280,360 L340,360 L340,390 L280,390 Z" fill="#15803d"/>
  
  <!-- Campfire -->
  <ellipse cx="250" cy="400" rx="15" ry="5" fill="#451a03"/>
  <path d="M240,400 Q245,385 250,400 Q255,385 260,400" fill="#ea580c" opacity="0.8"/>
  <path d="M245,400 Q248,390 250,400 Q252,390 255,400" fill="#fbbf24" opacity="0.9"/>
  
  <!-- Cabin/Lodge -->
  <rect x="350" y="340" width="80" height="50" fill="#92400e" stroke="#78350f" stroke-width="2"/>
  <path d="M345,340 L390,310 L435,340 Z" fill="#7c2d12"/>
  <rect x="370" y="360" width="15" height="20" fill="#fbbf24" opacity="0.8"/>
  <rect x="400" y="355" width="12" height="12" fill="#fbbf24" opacity="0.6"/>
  
  <!-- Ground/Terrain -->
  <path d="M0,380 Q100,370 200,375 Q300,380 400,375 Q450,378 500,380 L500,500 L0,500 Z" fill="#365314" opacity="0.8"/>
  
  <!-- Paradise Resort Text -->
  <text x="250" y="150" font-family="Arial, sans-serif" font-size="36" font-weight="bold" text-anchor="middle" fill="#ea580c">
    PARADISE
  </text>
  <text x="250" y="180" font-family="Arial, sans-serif" font-size="18" font-weight="normal" text-anchor="middle" fill="#ea580c">
    RESORT
  </text>
  <text x="250" y="200" font-family="Arial, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#fbbf24">
    ADVENTURE AWAITS
  </text>
</svg>