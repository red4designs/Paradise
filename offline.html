<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Offline | Paradise Resort Vattavada</title>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: #f8f9fa;
            color: #333;
            text-align: center;
        }

        .logo {
            width: 80px;
            height: 80px;
            margin-bottom: 2rem;
        }

        h1 {
            margin: 0 0 1rem;
            font-size: 2rem;
            color: #050510;
        }

        p {
            color: #666;
            max-width: 400px;
            margin: 0 1rem 2rem;
            line-height: 1.6;
        }

        button {
            background: #00cccc;
            color: white;
            border: none;
            padding: 0.75rem 2rem;
            border-radius: 50px;
            font-weight: 600;
            cursor: pointer;
            font-size: 1rem;
        }

        button:hover {
            opacity: 0.9;
        }
    </style>
</head>

<body>
    <img src="/paradise-logo.svg" alt="Paradise Resort" class="logo">
    <h1>You are Offline</h1>
    <p>It seems you have lost your internet connection. Please check your network setting and try again.</p>
    <button onclick="window.location.reload()">Retry Connection</button>
</body>

</html>
